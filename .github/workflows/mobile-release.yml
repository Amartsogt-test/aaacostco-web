name: Autonomous Mobile Release (Google Play & Apple App Store)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (production, beta, internal)'
        required: false
        default: 'production'

jobs:
  android-play-store:
    name: Build & Publish Android (.aab) to Google Play
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Prepare Mobile Assets
        run: |
          npm ci
          npm run mobile:prepare

      - name: Decode Android Keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.keystore

      - name: Build Android Release App Bundle (.aab) & APK
        if: env.COSTCO_KEYSTORE_PASSWORD != ''
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          COSTCO_KEYSTORE_FILE: release-key.keystore
          COSTCO_KEYSTORE_PASSWORD: ${{ secrets.COSTCO_KEYSTORE_PASSWORD }}
          COSTCO_KEY_ALIAS: ${{ secrets.COSTCO_KEY_ALIAS }}
          COSTCO_KEY_PASSWORD: ${{ secrets.COSTCO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Android Release Artifacts (.aab & .apk)
        uses: actions/upload-artifact@v4
        with:
          name: costco-mn-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      - name: Publish to Google Play Store via Fastlane
        if: env.GOOGLE_PLAY_JSON_KEY != ''
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PLAY_STORE_TRACK: ${{ github.event.inputs.track || 'production' }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY" > fastlane/play-store-credentials.json
          gem install fastlane
          fastlane android release

  ios-app-store:
    name: Build & Publish iOS (.ipa) to Apple App Store
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Prepare Mobile Assets
        run: |
          npm ci
          npx cap sync ios

      - name: Build, Sign & Upload iOS (.ipa) to Apple App Store Connect
        if: env.ASC_KEY_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/mobile/ios-ci-build-and-upload.mjs

      - name: Upload iOS Release Artifact (.ipa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costco-mn-ios-release
          path: output/ios/*.ipa

<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Costco.mn — Холболт шалгах</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #005DA3;
        color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .logo {
        font-size: 32px;
        font-weight: 900;
        margin-bottom: 12px;
      }
      .msg {
        font-size: 15px;
        opacity: 0.92;
        max-width: 300px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        background: #E31837;
        color: #ffffff;
        border: none;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="logo">COSTCO.MN</div>
    <p class="msg">Интернэт холболтоо шалгаад дахин оролдоно уу.</p>
    <button class="btn" onclick="window.location.href='https://costco.mn'">Дахин ачаалах</button>
  </body>
</html>

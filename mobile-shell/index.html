<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Costco.mn</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #005DA3;
        color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .logo {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin-bottom: 12px;
      }
      .sub {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 24px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      window.location.replace("https://costco.mn/?app=1");
    </script>
  </head>
  <body>
    <div class="logo">COSTCO.MN</div>
    <div class="sub">Солонгос Костко шууд захиалга...</div>
    <div class="spinner"></div>
  </body>
</html>
